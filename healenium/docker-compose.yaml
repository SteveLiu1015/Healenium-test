name: healenium

services:
  postgres-db:
    image: postgres:15.5-alpine
    container_name: postgres-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - ./db/sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - hlm-pgdata:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=healenium
      - POSTGRES_USER=healenium_user
      - POSTGRES_PASSWORD=YDk2nmNs4s9aCP6K
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healenium_user -d healenium"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - healenium

  healenium:
    image: healenium/hlm-backend:3.5.1
    container_name: healenium
    restart: unless-stopped
    ports:
      - "7878:7878"
    depends_on:
      postgres-db:
        condition: service_healthy
    environment:
      - SPRING_POSTGRES_DB=healenium
      - SPRING_POSTGRES_SCHEMA=healenium
      - SPRING_POSTGRES_USER=healenium_user
      - SPRING_POSTGRES_PASSWORD=YDk2nmNs4s9aCP6K
      - SPRING_POSTGRES_DB_HOST=postgres-db
      - KEY_SELECTOR_URL=false
      - COLLECT_METRICS=false
      - FIND_ELEMENTS_AUTO_HEALING=false
      - HLM_LOG_LEVEL=${HLM_LOG_LEVEL:-info}
    volumes:
      - ./screenshots/:/screenshots
      - ./logs/:/logs
    networks:
      - healenium

  selector-imitator:
    image: healenium/hlm-selector-imitator:1.6
    container_name: selector-imitator
    restart: unless-stopped
    ports:
      - "8000:8000"
    networks:
      - healenium

  hlm-proxy:
    image: healenium/hlm-proxy:2.2.1
    container_name: hlm-proxy
    restart: unless-stopped
    ports:
      - "8085:8085"
    depends_on:
      - healenium
      - selector-imitator
      - selenium-hub
    environment:
      - RECOVERY_TRIES=${RECOVERY_TRIES:-1}
      - SCORE_CAP=${SCORE_CAP:-.6}
      - HEAL_ENABLED=${HEAL_ENABLED:-true}
      - SELENIUM_SERVER_URL=http://selenium-hub:4444/wd/hub
      - HEALENIUM_SERVER_URL=http://localhost:7878
      - HEALENIUM_SERVICE=http://healenium:7878
      - IMITATE_SERVICE=http://selector-imitator:8000
      - HLM_LOG_LEVEL=${HLM_LOG_LEVEL:-debug}
    volumes:
      - ./logs/:/logs
    networks:
      - healenium

  selenium-hub:
    image: selenium/hub:4.27.0
    container_name: selenium-hub
    restart: unless-stopped
    ports:
      - "4442:4442"
      - "4443:4443"
      - "4444:4444"
    networks:
      - healenium

  chrome:
    image: selenium/node-chromium:4.27.0
    container_name: node-chrome
    restart: unless-stopped
    shm_size: 2gb
    depends_on:
      - selenium-hub
    # lets the containerised browser reach the Vite dev server on the WSL host
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
      - SE_NODE_MAX_INSTANCES=2
      - SE_NODE_MAX_SESSIONS=2
      - SE_NODE_SESSION_TIMEOUT=60
      - SE_VNC_NO_PASSWORD=1
    ports:
      - "7900:7900"
    networks:
      - healenium

volumes:
  hlm-pgdata:

networks:
  healenium:
    name: healenium
